<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tristan AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <h1 class="title">Tristan<span class="outlined"> AI</span></h1>
    <div class="card" role="region" aria-label="Main content box">
      <div class="welcome-note" aria-hidden="false">Tristan AI is ready for your questions</div>
      <div class="messages" aria-live="polite" aria-label="Chat messages"></div>
      <div class="input-row">
        <textarea class="card-input" aria-label="Message input" placeholder="Welcome — compose a prompt or start a conversation. Press Enter to send." rows="4"></textarea>
      </div>
    </div>
  </main>
</body>
<script>
  // Simple chat behavior: Enter (without Shift) sends the message into a bubble
  document.addEventListener('DOMContentLoaded', () => {
    const textarea = document.querySelector('.card-input');
    const messages = document.querySelector('.messages');
    const welcome = document.querySelector('.welcome-note');
    let firstSent = false;
    // count outgoing messages without an incoming response
    let pendingWithoutResponse = 0;
    // count control variables for system messages

    let statusTimer = null;

  function showWorkingThenReceived() {
      if (!welcome) return;
      // clear any pending timer so rapid sends reset the timing
      if (statusTimer) clearTimeout(statusTimer);
      welcome.classList.remove('muted');
      welcome.classList.add('working');
      welcome.textContent = 'working..';
      // after ~2 seconds, show received message text
      statusTimer = setTimeout(() => {
        welcome.classList.remove('working');
        welcome.classList.add('muted');
        welcome.textContent = 'Tristan AI has received your message.';
        welcome.setAttribute('aria-hidden', 'false');
        statusTimer = null;
      }, 2000);
    }

    function appendMessage(text) {
  // increment pending outgoing count; will be reset when an incoming message arrives
  pendingWithoutResponse++;
      const msg = document.createElement('div');
      msg.className = 'message outgoing';
      // preserve line breaks
      msg.textContent = text;
      messages.appendChild(msg);

      // update status: show working, then received (for every message)
      showWorkingThenReceived();

      // on first message, also change the placeholder
      if (!firstSent) {
        firstSent = true;
        textarea.placeholder = 'Type another message...';
      }

      // If 3 messages have been sent with no incoming response, show a system note
      if (pendingWithoutResponse >= 3) {
        appendSystemMessage('it seems tristan ai is busy right now');
        // reset the counter after notifying
        pendingWithoutResponse = 0;
      }

      // scroll to bottom smoothly
      messages.scrollTo({ top: messages.scrollHeight, behavior: 'smooth' });
    }

    function appendSystemMessage(text) {
      const sys = document.createElement('div');
      sys.className = 'message system incoming';
      sys.textContent = text;
      messages.appendChild(sys);
      messages.scrollTo({ top: messages.scrollHeight, behavior: 'smooth' });
    }

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const val = textarea.value.trim();
        if (!val) return;
        appendMessage(val);
        textarea.value = '';
        // keep focus so user can type again
        requestAnimationFrame(() => textarea.focus());
      }
    });

    // (Socket.IO client removed) Remote push/AI messages via Node server were removed.
    // If you want to re-add server push later, we can wire Socket.IO back in here.
  });
</script>
</html>
